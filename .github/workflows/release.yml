# Release and production deploy, started by pushing a tag vX.Y.Z.
#
# 1. release (GitHub-hosted): refuses a tag whose commit is not on main,
#    runs the Go and console checks, builds the bundle
#    (scripts/release-bundle.sh) and publishes it as a GitHub release.
# 2. deploy (self-hosted runner labelled deploybot-production): waits in
#    the "production" environment until a required reviewer approves,
#    downloads the release, checks SHA256SUMS, then runs the runner
#    machine's own deploy hook, which installs the bundle and runs
#    `deploybot-server api --migrate`. No production credential is
#    stored in GitHub.
#
# Setup (repository settings): an environment named "production" with
# required reviewers and deployment tags limited to v*; a self-hosted
# runner with the label deploybot-production on a machine that can reach
# production; and an executable /usr/local/lib/deploybot/deploy-release
# on that machine, called as `deploy-release <tag> <bundle dir>`.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; release tags go on main only"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
      - name: Go checks
        run: go build ./... && go vet ./... && go test ./...
      - name: Console checks
        working-directory: console
        run: pnpm install --frozen-lockfile && pnpm check && pnpm test
      - name: Build bundle
        run: scripts/release-bundle.sh "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Deploybot $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE.md \
            "dist/deploybot-server-$GITHUB_REF_NAME-linux-amd64" \
            "dist/bot-console-$GITHUB_REF_NAME.tar.gz" \
            dist/RELEASE.md dist/SHA256SUMS

  deploy:
    needs: release
    runs-on: [self-hosted, deploybot-production]
    environment:
      name: production
    steps:
      - name: Download and verify the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/bundle-$GITHUB_REF_NAME"
          rm -rf "$dir" && mkdir -p "$dir"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$dir"
          (cd "$dir" && sha256sum -c SHA256SUMS)
          echo "BUNDLE_DIR=$dir" >> "$GITHUB_ENV"
      - name: Deploy to production
        run: /usr/local/lib/deploybot/deploy-release "$GITHUB_REF_NAME" "$BUNDLE_DIR"
