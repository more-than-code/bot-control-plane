# Deploybot server release: tag, build, publish (spec bot-agent
# docs/spec-release-workflow.md; replaces the tag-push workflow of PR #4).
#
# Runs on every push to main and on demand. It does something only when the
# commit's version (the newest CHANGELOG.md heading, equal to
# console/package.json) has no published release yet:
#   meta     reads the version, refuses a tag on a commit outside this
#            history or a version not newer than the newest tag
#   check    the release gates: the full Go suite against a PostgreSQL 18 +
#            TimescaleDB test database with 0 skipped, the db package twice
#            more, console install, check, test (non-root runner user)
#   build    scripts/release-bundle.sh twice and the two images twice, each
#            compared byte for byte; then scripts/check-images.sh (not root,
#            console HEALTHCHECK, server binary equal to the bundle's) and
#            the server smoke checks (--help, health)
#   publish  creates tag vX.Y.Z on the commit, pushes the images to ghcr.io
#            by tag (each pushed digest must be the built one), and publishes the GitHub release with the bundle; the
#            release text is RELEASE.md plus the pushed image digests, and
#            the RELEASE.md asset stays as hashed into SHA256SUMS.
#            Deploying stays Joe's step.
# No approval tap (spec D3): the merge into main is the approval. A tag pushed
# with GITHUB_TOKEN starts no workflow, so tagging happens in this run.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GOFLAGS: -mod=readonly
  IMAGE_SERVER: ghcr.io/more-than-code/deploybot-server
  IMAGE_CONSOLE: ghcr.io/more-than-code/deploybot-console

jobs:
  meta:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(sed -n 's/^## v\([0-9][0-9.]*\) — .*/\1/p' CHANGELOG.md | head -n1)
          pkg=$(sed -n 's/^  "version": "\([0-9.]*\)",$/\1/p' console/package.json)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::cannot read the newest CHANGELOG.md version"; exit 1; }
          tag="v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          git fetch --force --tags --quiet origin
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            at=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$at" != "$GITHUB_SHA" ]; then
              if git merge-base --is-ancestor "$at" HEAD; then
                echo "No new version on this commit ($tag is on $at); nothing to do." >> "$GITHUB_STEP_SUMMARY"
                echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
              echo "::error::$tag already exists on $at, which is not in this commit's history"; exit 1
            fi
            if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)" = "false" ]; then
              echo "$tag is already released; nothing to do." >> "$GITHUB_STEP_SUMMARY"
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          [ "$pkg" = "$v" ] || { echo "::error::console/package.json version $pkg is not $v"; exit 1; }
          prev=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$tag" | sort -V | tail -n1 || true)
          if [ -n "$prev" ] && [ "$(printf '%s\n%s\n' "$prev" "$tag" | sort -V | tail -n1)" != "$tag" ]; then
            echo "::error::$tag is not newer than $prev"; exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  check:
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test database and Node (scripts/cloud-setup.sh)
        run: |
          sudo env PATH="$PATH" bash scripts/cloud-setup.sh
          echo /opt/node24/bin >> "$GITHUB_PATH"
          {
            echo "DEPLOYBOT_TEST_DATABASE_URL=postgres://deploybot_migrator@127.0.0.1:5433/deploybot_test?sslmode=disable"
            echo "DEPLOYBOT_TEST_API_DATABASE_URL=postgres://deploybot_api@127.0.0.1:5433/deploybot_test?sslmode=disable"
          } >> "$GITHUB_ENV"
      - name: Not root
        run: test "$(id -u)" -ne 0
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: build and vet
        run: go build ./... && go vet ./...
      - name: Full Go suite, 0 skipped
        env:
          # Opt-in timing test (TestHostResourceStatsPerf); without it the
          # suite has one skip and this gate fails.
          BOT_TEST_PERF: "1"
        run: |
          set -euo pipefail
          go test -count=1 -json ./... > "$RUNNER_TEMP/go-test.json" || { grep -E '"Action":"fail"' "$RUNNER_TEMP/go-test.json" | head -50; exit 1; }
          skips=$(grep -c '"Action":"skip","Package":"[^"]*","Test"' "$RUNNER_TEMP/go-test.json" || true)
          echo "skipped tests: $skips"
          if [ "$skips" != "0" ]; then grep '"Action":"skip","Package":"[^"]*","Test"' "$RUNNER_TEMP/go-test.json"; exit 1; fi
      - name: db package twice more
        run: go test -count=2 ./api/internal/db/
      - name: Console
        working-directory: console
        run: pnpm install --frozen-lockfile && pnpm check && pnpm test

  build:
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Node (scripts/cloud-setup.sh)
        run: |
          sudo env PATH="$PATH" bash scripts/cloud-setup.sh
          echo /opt/node24/bin >> "$GITHUB_PATH"
      - name: Bundle twice and compare
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          scripts/release-bundle.sh "$tag" "$RUNNER_TEMP/a"
          go clean -cache
          rm -rf console/build console/.svelte-kit
          scripts/release-bundle.sh "$tag" "$RUNNER_TEMP/b"
          (cd "$RUNNER_TEMP/a" && for f in *; do cmp "$f" "../b/$f"; done)
          mkdir -p dist && cp "$RUNNER_TEMP/a/"* dist/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Images twice and compare
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p images
          for img in server console; do
            for run in a b; do
              docker buildx build --no-cache --platform linux/amd64,linux/arm64 \
                --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH \
                --output "type=oci,dest=$RUNNER_TEMP/$img-$run.tar,rewrite-timestamp=true" \
                -f "build/docker/$img.Dockerfile" .
              tar -xOf "$RUNNER_TEMP/$img-$run.tar" index.json > "$RUNNER_TEMP/$img-$run.index.json"
            done
            cmp "$RUNNER_TEMP/$img-a.index.json" "$RUNNER_TEMP/$img-b.index.json"
            mv "$RUNNER_TEMP/$img-a.tar" "images/$img.tar"
          done
      - name: Check images
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Not root, the console's HEALTHCHECK, and the server binary in each
          # platform's image equal to the bundle binary (docs/spec-release-image-checks.md).
          scripts/check-images.sh "v$VERSION" images dist
          # The smoke checks in docs/containers.md, on the amd64 server image.
          img=deploybot-server-check:amd64
          skopeo copy --quiet --override-os linux --override-arch amd64 \
            oci-archive:images/server.tar "docker-daemon:$img"
          docker run --rm --network none "$img" --help >/dev/null
          set +e
          docker run --rm --network none "$img" health http://127.0.0.1:1/; h1=$?
          docker run --rm --network none "$img" health http://example.com/; h2=$?
          set -e
          if [ "$h1" != 1 ] || [ "$h2" != 2 ]; then
            echo "::error::health smoke checks exited $h1 and $h2, want 1 and 2"; exit 1
          fi
          docker image rm "$img" >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images/
          if-no-files-found: error

  publish:
    needs: [meta, check, build]
    if: github.ref == 'refs/heads/main' && needs.meta.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Only this workflow on main may publish
        env:
          WANT: ${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
          GOT: ${{ github.workflow_ref }}
        run: test "$GOT" = "$WANT" || { echo "::error::refusing to publish from $GOT"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: images
      - name: Push images by tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # The release text is RELEASE.md plus the pushed digests. RELEASE.md
          # itself stays as hashed into SHA256SUMS.
          cp dist/RELEASE.md "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "## Images"
            echo
            echo "Deploy by digest (docs/containers.md); the tags are for people. These digests are in the release text only, not in the RELEASE.md asset."
            echo
          } >> "$RUNNER_TEMP/notes.md"
          for img in server console; do
            ref=$IMAGE_SERVER; [ "$img" = console ] && ref=$IMAGE_CONSOLE
            skopeo copy --all --preserve-digests --digestfile "$RUNNER_TEMP/$img.digest" \
              "oci-archive:images/$img.tar" "docker://$ref:v$VERSION"
            # The pushed digest is the one the build compared.
            want=$(tar -xOf "images/$img.tar" index.json | jq -r '.manifests[0].digest')
            got=$(cat "$RUNNER_TEMP/$img.digest")
            [ "$got" = "$want" ] || { echo "::error::$img pushed as $got, built as $want"; exit 1; }
            echo "- \`$ref@$(cat "$RUNNER_TEMP/$img.digest")\` (linux/amd64, linux/arm64)" >> "$RUNNER_TEMP/notes.md"
          done
          skopeo logout ghcr.io
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          (cd dist && sha256sum -c --strict SHA256SUMS)
          assets=(dist/deploybot-server-"$tag"-linux-amd64 dist/deploybot-server-"$tag"-linux-arm64 \
            "dist/bot-console-$tag.tar.gz" dist/RELEASE.md dist/SHA256SUMS)
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Deploybot $tag" --notes-file "$RUNNER_TEMP/notes.md" "${assets[@]}"
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published $tag." >> "$GITHUB_STEP_SUMMARY"
